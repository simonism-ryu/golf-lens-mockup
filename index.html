<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WTD">
<title>WTD 골프</title>
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --red:#F9423A; --ink:#15171A; --ink2:#4A4F57; --ink3:#868C95; --ink4:#B4B8BF; --line:#E8EAED;
  --bg:#F4F5F7; --card:#FFFFFF; --soft:#F7F8FA; --navy:#11212F; --kakao:#FEE500;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px); --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink);background:#fff;overscroll-behavior:none;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
.i{display:block;flex:none}
.logo{display:block;fill:currentColor}

/* ---------- 무대 (PC = 휴대폰 틀, 모바일 = 전체 화면) ---------- */
#stage{height:100%}
#device{position:relative;width:100%;height:100%}
#app{position:relative;width:100%;height:100%;overflow:hidden;overflow:clip;background:var(--bg);isolation:isolate}
.scr{overflow:hidden;overflow:clip}
.sbar,.side{display:none}
@media (min-width:700px){
  body{background:#E4E6E9}
  #stage{display:flex;align-items:center;justify-content:center;gap:64px;min-height:100%;padding:20px}
  #device{--dh:min(874px,calc(100vh - 40px));height:var(--dh);width:calc(var(--dh) * .4748);flex:none;border-radius:58px;background:#0C0D0F;padding:11px;box-shadow:0 0 0 2px #2A2C30,0 30px 70px rgba(17,33,47,.28)}
  #app{border-radius:47px;--top:48px;--bot:18px}
  .sbar{display:flex;position:absolute;z-index:90;top:0;left:0;right:0;height:48px;align-items:center;justify-content:space-between;padding:4px 30px 0 38px;font-size:15px;font-weight:600;pointer-events:none;color:var(--ink);transition:color .2s}
  #app.sb-light .sbar{color:#fff}
  .sbar .island{position:absolute;left:50%;top:11px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000}
  .sbar .sbic{display:flex;gap:6px;align-items:center}
  .side{display:block;width:250px;color:var(--ink2)}
  .side .logo{width:120px;color:var(--red);margin-bottom:22px}
  .side h2{font-size:20px;line-height:1.4;margin:0 0 10px;color:var(--ink);font-weight:700}
  .side p{font-size:13.5px;line-height:1.6;margin:0 0 20px}
  .side .qr{width:148px;height:148px;padding:10px;background:#fff;border-radius:14px}
  .side .qr img,.side .qr canvas{width:128px!important;height:128px!important;display:block}
  .side small{display:block;margin-top:10px;font-size:12px;color:var(--ink3)}
}
@media (min-width:700px) and (max-width:1000px){.side{display:none}}

/* ---------- 화면 전환 ---------- */
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.scr.on{display:flex}
.scr.inR{animation:inR .34s cubic-bezier(.2,.8,.2,1);z-index:5;box-shadow:-12px 0 30px rgba(0,0,0,.08)}
.scr.outR{display:flex;animation:outR .3s cubic-bezier(.4,0,.6,1) forwards;z-index:6}
.scr.inF{animation:inF .24s ease}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes outR{from{transform:none}to{transform:translateX(100%)}}
@keyframes inF{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--tabh) + var(--bot) + 24px)}
.notab .body{padding-bottom:calc(var(--bot) + 24px)}
.body::-webkit-scrollbar{display:none}

/* 머리 */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(var(--top) + 8px) 12px 8px;min-height:calc(var(--top) + 56px);background:var(--bg);position:relative;z-index:3}
.top.white{background:#fff}
.top h1{font-size:18px;font-weight:700;margin:0;flex:1;padding-left:6px}
.top .ttl{flex:1;text-align:center;font-size:16px;font-weight:700;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl.show{opacity:1}
.ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.ib:active{background:rgba(0,0,0,.06)}
.ib .dotn{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:4px;background:var(--red);border:1.5px solid var(--bg)}

/* 탭 막대 */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;height:calc(var(--tabh) + var(--bot));padding-bottom:var(--bot);display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.tabbar.hide{transform:translateY(105%)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink4)}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .i{stroke-width:2.2}

/* 공통 */
.pad{padding:0 20px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:0 16px 12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:22px 20px 10px;font-size:17px;font-weight:700}
.sec-h small{font-size:13px;color:var(--ink3);font-weight:500}
.fine{font-size:12px;line-height:1.55;color:var(--ink3)}
.c{text-align:center}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;vertical-align:middle}
.b-forest{background:#E7F3EA;color:#25683D}.b-inland{background:#F3EFE4;color:#7A6020}.b-coast{background:#E5F0F8;color:#245A82}
.b-ok{background:#F0FAF3;color:#2C6B3C}.b-wait{background:#FFF4E5;color:#7A5212}.b-ed{background:#F5D9A8;color:#7A3B1A}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;font-size:16px;font-weight:700;background:var(--ink);color:#fff;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#D5D8DD;color:#fff;cursor:default}
.btn.red{background:var(--red)}
.btn.kakao{background:var(--kakao);color:#191919}
.btn.line{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{height:44px;font-size:14.5px;border-radius:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 20px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:#fff;font-size:13.5px;font-weight:600;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.lens{display:block;flex:none;width:46px;height:30px;border-radius:15px 15px 18px 18px/12px 12px 22px 22px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 6px 4px 8px rgba(255,255,255,.45)}
.seg3{display:flex;background:#E9EBEE;border-radius:12px;padding:3px}
.seg3 button{flex:1;height:40px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.seg3 button small{font-size:10.5px;font-weight:500;color:var(--ink3);margin-top:1px}
.seg3 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ---------- 홈 ---------- */
#s-home .top{padding-left:20px}
#s-home .top .logo{width:66px;color:var(--red)}
.hello{padding:8px 20px 18px}
.hello .date{font-size:13.5px;color:var(--ink3);font-weight:600;margin-bottom:6px}
.hello h2{font-size:25px;line-height:1.36;margin:0;font-weight:800;letter-spacing:-.03em}
.mycourse{display:block;width:calc(100% - 32px);margin:0 16px 12px;padding:18px;border-radius:22px;background:#fff;text-align:left}
.mycourse .row1{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);font-weight:600}
.mycourse .nm{font-size:21px;font-weight:800;margin:6px 0 2px;display:flex;align-items:center;gap:8px}
.mycourse .tm{font-size:13px;color:var(--ink2)}
.mini-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:14px 0 8px;gap:2px}
.mini-bar i{display:block;height:100%}
.mycourse .now{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.mycourse .now b{display:block;font-size:16px}
.mycourse .now span{font-size:12.5px;color:var(--ink3)}
.mycourse .now .chev{margin-left:auto;color:var(--ink4)}
.hero-map{position:relative;display:block;width:calc(100% - 32px);margin:0 16px 12px;padding:22px 20px 20px;border-radius:22px;background:var(--navy);color:#fff;text-align:left;overflow:hidden;min-height:170px}
.hero-map .k{font-size:12.5px;font-weight:700;color:#FFB3AF;letter-spacing:.02em}
.hero-map h3{font-size:21px;line-height:1.38;margin:8px 0 6px;font-weight:800}
.hero-map p{margin:0;font-size:13.5px;color:#B7C0C9;line-height:1.5;max-width:210px}
.hero-map .go{display:inline-flex;align-items:center;gap:4px;margin-top:16px;height:36px;padding:0 14px;border-radius:18px;background:#fff;color:var(--ink);font-size:13.5px;font-weight:700}
.hero-map svg.deco{position:absolute;right:-20px;bottom:-14px;opacity:.95}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.tile{background:#fff;border-radius:20px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile .ti{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--soft)}
.tile b{font-size:15px;display:block;margin-top:14px}
.tile span{font-size:12px;color:var(--ink3);margin-top:2px;display:block}
.swatches{display:flex;gap:10px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none}
.swatches::-webkit-scrollbar{display:none}
.sw{flex:none;width:96px;background:#fff;border-radius:18px;padding:14px 10px 12px;text-align:center}
.sw .lens{width:62px;height:40px;margin:0 auto 10px}
.sw b{display:block;font-size:13px;line-height:1.3}
.sw span{font-size:11px;color:var(--ink3)}
.promo{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);margin:12px 16px 0;padding:16px 18px;border-radius:20px;background:#fff;text-align:left}
.promo .pi{width:46px;height:46px;border-radius:14px;background:#FFF1F0;color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.promo b{display:block;font-size:15px}
.promo span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}

/* ---------- 빛 지도 ---------- */
#s-map{background:#E9ECEF}
#mapEl{position:absolute;inset:0;z-index:1;background:#EEF0F2}
.mapfail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:14px}
.map-top{position:absolute;z-index:5;left:0;right:0;top:0;padding:calc(var(--top) + 8px) 12px 0;pointer-events:none}
.map-top>*{pointer-events:auto}
.msearch{display:flex;align-items:center;gap:8px;height:50px;padding:0 16px;border-radius:25px;background:#fff;box-shadow:0 4px 18px rgba(17,33,47,.14)}
.msearch input{flex:1;border:0;outline:0;background:none;font-size:15.5px;min-width:0}
.msearch input::placeholder{color:var(--ink4)}
.msearch .x{color:var(--ink4);display:none}
.msearch.typing .x{display:block}
.slotbar{display:flex;gap:4px;margin-top:10px;padding:4px;border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 4px 14px rgba(17,33,47,.1);width:max-content;max-width:100%}
.slotbar button{height:30px;padding:0 11px;border-radius:14px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.slotbar button.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:10px;margin-top:8px;padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.92);font-size:11.5px;color:var(--ink2);width:max-content;box-shadow:0 2px 8px rgba(17,33,47,.08)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:4px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.locbtn{position:absolute;z-index:5;right:14px;width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:0 4px 14px rgba(17,33,47,.15);display:flex;align-items:center;justify-content:center;transition:bottom .3s cubic-bezier(.2,.8,.2,1)}
.pinw{background:none;border:0}
.osm{position:absolute;z-index:5;left:12px;max-width:calc(100% - 80px);font-size:10px;line-height:1.4;color:var(--ink2);background:rgba(255,255,255,.88);padding:2px 7px;border-radius:6px;text-align:left;transition:bottom .3s cubic-bezier(.2,.8,.2,1)}
.osm b{font-weight:600}
.osm span{display:none}
.osm.open span{display:inline}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 6px));display:flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 6px;border-radius:15px;background:#fff;box-shadow:0 3px 10px rgba(17,33,47,.22);white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--ink);transition:transform .18s,opacity .2s;font-family:'Pretendard Variable',Pretendard,sans-serif}
.pin::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.pin i{width:18px;height:18px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pin.sel{background:var(--ink);color:#fff;transform:translate(-50%,calc(-100% - 6px)) scale(1.1)}
.pin.sel::after{border-top-color:var(--ink)}
.pin.pdim{opacity:.35}
.pin b{font-weight:700}
#mapEl.far .pin:not(.sel){padding:0 6px;height:30px;width:30px;justify-content:center}
#mapEl.far .pin:not(.sel) b{display:none}
.leaflet-tile-pane{filter:saturate(.85)}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
.msheet{position:absolute;z-index:6;left:0;right:0;bottom:calc(var(--tabh) + var(--bot));height:calc(100% - var(--top) - 150px - var(--tabh) - var(--bot));background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(17,33,47,.12);display:flex;flex-direction:column;transform:translateY(calc(100% - var(--peek)));transition:transform .32s cubic-bezier(.2,.8,.2,1);--peek:118px}
.msheet.sel{--peek:236px}
.msheet.full{transform:none}
.msheet .grab{flex:none;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.msheet .grab::before{content:'';width:38px;height:5px;border-radius:3px;background:#D9DCE0}
.ms-head{flex:none;touch-action:none}
.ms-head h3{margin:0;padding:2px 20px 12px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.ms-head h3 small{font-size:13px;color:var(--ink3);font-weight:500}
.ms-body{flex:1;overflow-y:auto;padding:4px 0 16px;overscroll-behavior:contain;scrollbar-width:none}
.ms-body::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;text-align:left}
.crow:active{background:var(--soft)}
.crow .cd{width:12px;height:12px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.crow .nm{font-size:15.5px;font-weight:700}
.crow .sub{font-size:12.5px;color:var(--ink3);margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.crow .rt{margin-left:auto;text-align:right;font-size:12px;color:var(--ink3);flex:none}
.crow .rt b{display:block;font-size:13px;color:var(--ink);margin-bottom:2px}
.types{padding:16px 20px 4px}
.types h4{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.types .tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.types button{background:var(--soft);border-radius:14px;padding:12px 10px;font-size:13px;font-weight:700;text-align:center}
.types button .i{margin:0 auto 6px;color:var(--ink2)}
.empty{padding:26px 20px;text-align:center;font-size:14px;color:var(--ink3);line-height:1.6}
.preview{padding:0 20px 14px}
.preview .nm{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.preview .sub{font-size:13px;color:var(--ink3);margin:4px 0 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.preview .rec{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--soft);margin-bottom:12px}
.preview .rec b{display:block;font-size:15px}
.preview .rec span{font-size:12.5px;color:var(--ink3)}

/* ---------- 골프장 상세 ---------- */
#s-course .top{position:absolute;left:0;right:0;top:0;background:transparent;color:#fff;transition:background .2s,color .2s}
#s-course .top.solid{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.chero{position:relative;padding:calc(var(--top) + 70px) 20px 26px;color:#fff;overflow:hidden}
.chero.t-forest{background:linear-gradient(160deg,#173326 0%,#2B5C42 100%)}
.chero.t-inland{background:linear-gradient(160deg,#2C331F 0%,#61703C 100%)}
.chero.t-coast{background:linear-gradient(160deg,#0F2A40 0%,#21628A 100%)}
.chero svg.contour{position:absolute;right:-40px;top:20px;opacity:.16}
.chero .bdg{display:flex;gap:6px;margin-bottom:10px;position:relative}
.chero .bdg .badge{background:rgba(255,255,255,.16);color:#fff}
.chero h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;position:relative}
.chero .sub{font-size:13.5px;opacity:.8;margin-top:4px;position:relative}
.chero p{margin:14px 0 0;font-size:14px;line-height:1.6;opacity:.92;position:relative}
.dates{display:flex;gap:6px;overflow-x:auto;padding:16px 16px 4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button,.dates label{flex:none;width:54px;height:62px;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--ink3);font-weight:600;position:relative;cursor:pointer}
.dates b{font-size:17px;color:var(--ink);margin-top:2px}
.dates .on{background:var(--ink);color:#B4B8BF}
.dates .on b{color:#fff}
.dates label input{position:absolute;inset:0;opacity:0;cursor:pointer}
.light h3{margin:0;font-size:17px;display:flex;align-items:baseline;justify-content:space-between}
.light h3 small{font-size:12.5px;color:var(--ink3);font-weight:500}
.arc{display:block;width:100%;margin:6px 0 0}
.dbar{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px;margin:0 4.6%;position:relative}
.dbar .sg{height:100%;font-size:11px;font-weight:700;color:rgba(21,23,26,.62);display:flex;align-items:center;justify-content:center;transition:filter .2s;min-width:0;overflow:hidden;white-space:nowrap}
.dbar .sg.lv-dark{color:rgba(255,255,255,.85)}
.dbar .sg.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.dbar .nowt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red);border-radius:1px}
.ttimes{display:flex;justify-content:space-between;margin:8px 4.6% 0;font-size:11.5px;color:var(--ink3)}
.ttimes b{color:var(--ink2)}
.rec-card .lbl{font-size:13px;color:var(--ink3);font-weight:600}
.rec-card h3{margin:4px 0 12px;font-size:24px;font-weight:800;letter-spacing:-.03em}
.meter{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#FBF6F1 0%,#E4E2DF 45%,#3E434B 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.meter .pin2{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:11px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25),inset 0 0 0 5px var(--ink);transition:left .35s cubic-bezier(.2,.8,.2,1)}
.mlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin:8px 0 14px}
.why{font-size:14px;line-height:1.6;color:var(--ink2);margin:0 0 12px}
.tip{display:flex;gap:8px;padding:12px 14px;border-radius:14px;background:#FFF8EC;font-size:13px;line-height:1.55;color:#6B5420}
.tip .i{color:#D99A2B;margin-top:1px}
.prod{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line);text-align:left}
.prod:first-of-type{margin-top:14px}
.prod b{display:block;font-size:15px}
.prod span.s{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.prod .cta{margin-left:auto;height:34px;padding:0 13px;border-radius:17px;background:var(--soft);font-size:13px;font-weight:700;display:flex;align-items:center;flex:none}
.alertrow{display:flex;align-items:center;gap:12px;margin:0 16px 12px;padding:16px 18px;border-radius:20px;background:#fff;text-align:left;width:calc(100% - 32px)}
.alertrow .ai{width:42px;height:42px;border-radius:13px;background:#FFF1F0;color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.alertrow b{display:block;font-size:15px}
.alertrow span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.alertrow .tg{margin-left:auto;flex:none;width:50px;height:30px;border-radius:15px;background:#D5D8DD;position:relative;transition:background .2s}
.alertrow .tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.alertrow.on .tg{background:#2DB45A}
.alertrow.on .tg::after{transform:translateX(20px)}
.info-card p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.linkbtn{font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:2px}

/* ---------- 렌즈 찾기 ---------- */
.qprog{height:4px;background:#E4E6EA;border-radius:2px;margin:0 20px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.qwrap{padding:22px 20px 0}
.qwrap.anim{animation:inF .25s ease}
.qn{font-size:13px;font-weight:700;color:var(--red)}
.qt{font-size:24px;line-height:1.38;margin:6px 0 6px;font-weight:800;letter-spacing:-.03em}
.qs{margin:0 0 20px;font-size:14px;color:var(--ink3);line-height:1.5}
.qsearch{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.qsearch input{flex:1;border:0;outline:0;background:none;font-size:15.5px;min-width:0}
.hits{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hit{display:flex;align-items:center;gap:8px;padding:13px 14px;border-radius:14px;background:#fff;font-size:14.5px;text-align:left}
.hit.on{box-shadow:inset 0 0 0 2px var(--ink)}
.hit small{color:var(--ink3);font-size:12.5px}
.or{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3);margin:20px 0 12px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:18px;background:#fff;text-align:left;transition:box-shadow .15s}
.opt .oi{width:44px;height:44px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.opt b{display:block;font-size:15.5px}
.opt span.s{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.opt.on{box-shadow:inset 0 0 0 2px var(--ink)}
.opt.on .oi{background:var(--ink);color:#fff}
.qfoot{flex:none;padding:12px 20px calc(var(--tabh) + var(--bot) + 12px);background:linear-gradient(rgba(244,245,247,0),var(--bg) 30%)}
.res-hero{position:relative;border-radius:24px;padding:22px 20px;margin-top:4px;overflow:hidden}
.res-hero .lens{position:absolute;right:20px;top:24px;width:84px;height:54px}
.res-hero .k{font-size:13px;font-weight:600;opacity:.75}
.res-hero h3{margin:6px 0 4px;font-size:28px;font-weight:800;letter-spacing:-.03em}
.reasons{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.reasons li{display:flex;gap:10px;font-size:14px;line-height:1.6;color:var(--ink2)}
.reasons .n{flex:none;width:22px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.reasons b{color:var(--ink)}

/* ---------- 내 카드 ---------- */
.ghost{margin:10px 24px 0;aspect-ratio:1.586;border-radius:22px;border:2px dashed #CDD1D6;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink4);gap:8px;font-size:13px;font-weight:600}
.intro{padding:26px 24px 0;text-align:center}
.intro h2{font-size:23px;line-height:1.4;margin:0 0 8px;font-weight:800;letter-spacing:-.03em}
.intro p{margin:0 0 22px;font-size:14px;color:var(--ink3);line-height:1.6}
.blist{list-style:none;margin:0;padding:0}
.blist li{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.blist li:last-child{border-bottom:0}
.blist .bi{width:42px;height:42px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.blist b{display:block;font-size:15px}
.blist span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.ocwrap{padding:6px 20px 0;perspective:900px}
.ocard{--tx:0;--ty:0;--ink:#9FAAB6;--num:#D8DFE6;--hl:rgba(255,255,255,.13);--lo:rgba(0,0,0,.62);--sh:.09;position:relative;aspect-ratio:1.586;border-radius:16px;overflow:hidden;color:var(--ink);background:linear-gradient(158deg,#26323F 0%,#16202A 46%,#0C1218 100%);box-shadow:0 1px 0 rgba(255,255,255,.5),0 22px 38px -10px rgba(10,18,26,.55),0 4px 10px rgba(10,18,26,.25);transform-style:preserve-3d;transition:transform .15s ease-out}
.ocard.ed{--ink:#43361C;--num:#2F2511;--hl:rgba(255,248,226,.6);--lo:rgba(60,44,14,.28);--sh:.3;background:linear-gradient(158deg,#DDD0B3 0%,#BEAC83 46%,#8E7B53 100%)}
.ocard .lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,rgba(0,0,0,.06) 1px 2px),repeating-linear-gradient(0deg,transparent 0 4px,rgba(255,255,255,.035) 4px 5px,transparent 5px 9px);mix-blend-mode:soft-light;opacity:.9}
.ocard.ed .lines{mix-blend-mode:multiply;opacity:.35}
.ocard .sheen{position:absolute;inset:0;background:conic-gradient(from 8deg at calc(36% + var(--tx) * 12%) calc(34% + var(--ty) * 12%),rgba(255,255,255,0) 0deg,rgba(255,255,255,var(--sh)) 30deg,rgba(255,255,255,0) 66deg,rgba(255,255,255,0) 176deg,rgba(255,255,255,calc(var(--sh) * .8)) 212deg,rgba(255,255,255,0) 252deg,rgba(255,255,255,0) 360deg)}
.ocard::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.1) 38%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.34));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.ocard.ed::after{background:linear-gradient(135deg,rgba(255,252,238,.95),rgba(255,244,214,.3) 40%,rgba(90,68,28,.18) 62%,rgba(255,248,226,.7))}
.ocard .lens-w{position:absolute;right:8%;top:12.5%;width:19%;height:15.5%;transform:rotate(-8deg);filter:drop-shadow(0 1.5px 1.2px rgba(0,0,0,.5))}
.ocard.ed .lens-w{filter:drop-shadow(0 1.5px 1.2px rgba(60,44,14,.45))}
.ocard .lens-rim,.ocard .lens-r{position:absolute;inset:0;clip-path:url(#ocLens)}
.ocard .lens-rim{transform:scale(1.09);background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.18) 50%,rgba(255,255,255,.55))}
.ocard.ed .lens-rim{background:linear-gradient(135deg,rgba(255,252,238,.95),rgba(255,244,214,.35) 50%,rgba(255,248,226,.8))}
.ocard .lens-r{overflow:hidden;filter:saturate(.88) brightness(.94)}
.ocard.ed .lens-r{background:linear-gradient(135deg,#6A5630 0%,#2E2412 58%,#18120A 100%)!important}
.ocard .lens-r i{position:absolute;display:block}
.ocard .lens-r .sky{inset:-14% 0;transform:translateY(calc(var(--ty) * 6px));background:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.04) 49%,rgba(255,255,255,0) 50%,rgba(6,12,20,.26) 51%,rgba(6,12,20,.52) 100%)}
.ocard .lens-r .hz{left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85) 25%,rgba(255,255,255,.85) 75%,transparent);transform:translateY(calc(var(--ty) * 6px))}
.ocard .lens-r .gloss{inset:0;background:linear-gradient(104deg,transparent 26%,rgba(255,255,255,.4) 40%,rgba(255,255,255,.04) 50%,transparent 58%);transform:translateX(calc(var(--tx) * 50%))}
.ocard .shine{position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-60%);pointer-events:none}
.ocard.issue .shine{animation:shine 1.4s .2s ease-out}
@keyframes shine{to{transform:translateX(60%)}}
.ocard.issue{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.88) rotateX(18deg);opacity:0}to{transform:none;opacity:1}}
.oc{position:absolute;inset:0;padding:21px 22px 18px;display:flex;flex-direction:column;justify-content:space-between}
.oc-top .logo{width:56px;color:var(--ink);filter:drop-shadow(0 -1px 0 var(--lo)) drop-shadow(0 1px 0 var(--hl))}
.oc-top small{display:block;font-size:8.5px;letter-spacing:.28em;color:var(--ink);opacity:.82;margin-top:9px;font-weight:600;text-shadow:0 -1px 0 var(--lo),0 1px 0 var(--hl)}
.oc .model{font-size:11.5px;color:var(--ink);letter-spacing:.06em;font-weight:500;text-shadow:0 -1px 0 var(--lo),0 1px 0 var(--hl)}
.oc .no{font-size:29px;font-weight:300;letter-spacing:.13em;font-variant-numeric:tabular-nums;margin-top:5px;color:var(--num);white-space:nowrap;text-shadow:0 -1px 0 var(--lo),0 1px 0 var(--hl)}
.oc .no b{font-weight:500}
.oc .no em{font-style:normal;font-size:12px;letter-spacing:.14em;opacity:.7}
.oc-bot{position:relative;display:flex;gap:18px;font-size:8.5px;color:var(--ink);padding-top:11px;letter-spacing:.1em}
.oc-bot::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(180deg,var(--lo) 0 1px,var(--hl) 1px 2px)}
.oc-bot span{opacity:.88}
.oc-bot b{display:block;font-size:12px;color:var(--num);font-weight:600;margin-top:4px;letter-spacing:.03em;white-space:nowrap;text-shadow:0 -1px 0 var(--lo),0 1px 0 var(--hl)}
.oc-bot .nil{opacity:.7;letter-spacing:.18em;font-weight:400}
.okline{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:#2C6B3C;font-weight:600;margin:16px 0 4px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 0}
.act{background:#fff;border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.3;color:var(--ink)}
.act .ai{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.act.hl .ai{background:#FFF1F0;color:var(--red)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:14px;padding:10px 0;font-size:14px;align-items:baseline;line-height:1.5}
.tl .d{flex:none;width:44px;font-size:12.5px;color:var(--ink3);font-weight:700;font-variant-numeric:tabular-nums}
.tl .off{color:var(--ink4)}
.tl button.b{font-size:13px;font-weight:700;color:var(--red)}
.kv{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink3)}

/* QR 스캔 */
#s-scan{background:#000;color:#fff}
.cam{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,#3A3E44 0%,#16181B 60%,#0A0B0C 100%)}
.cam .case{position:absolute;left:50%;top:44%;width:300px;height:200px;margin:-100px 0 0 -150px;border-radius:90px;background:radial-gradient(70% 60% at 50% 40%,#2F3237,#1B1D20);box-shadow:inset 0 0 0 2px rgba(255,255,255,.04);transform:rotate(-8deg);filter:blur(.4px)}
.cam .qrimg{position:absolute;left:50%;top:44%;width:96px;height:96px;margin:-48px 0 0 -48px;background:#fff;border-radius:6px;padding:7px;transform:rotate(-8deg);opacity:.92}
.scan-top{position:relative;z-index:2;display:flex;align-items:center;padding:calc(var(--top) + 8px) 12px 8px;color:#fff}
.scan-top h1{flex:1;text-align:center;font-size:16px;margin:0;font-weight:700;padding-right:40px}
.vf{position:absolute;left:50%;top:44%;width:236px;height:236px;margin:-118px 0 0 -118px;z-index:2}
.vf i{position:absolute;width:36px;height:36px;border:4px solid #fff;transition:border-color .2s}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.vf .ln{position:absolute;left:14px;right:14px;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);box-shadow:0 0 12px var(--red);animation:scanln 1.8s ease-in-out infinite}
@keyframes scanln{0%,100%{top:16px}50%{top:216px}}
.vf.done i{border-color:#3CD070}
.vf.done .ln{display:none}
.scan-cap{position:absolute;z-index:2;left:0;right:0;top:calc(44% + 140px);text-align:center;font-size:14.5px;line-height:1.6;color:#E6E8EB;padding:0 30px}
.scan-demo{position:absolute;z-index:2;left:0;right:0;bottom:calc(var(--bot) + 26px);text-align:center}
.scan-demo small{display:block;font-size:11.5px;color:#8D939B;margin-bottom:8px}
.scan-demo .chips{justify-content:center}
.scan-demo .chip{background:rgba(255,255,255,.12);color:#E6E8EB;box-shadow:none}
.scan-demo .chip.on{background:#fff;color:var(--ink)}

/* 등록 */
.scanned{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:#fff;margin:4px 16px 0}
.scanned .lens{width:58px;height:38px}
.scanned>div{flex:1;min-width:0}
.scanned b{display:block;font-size:15.5px}
.scanned span{display:block;font-size:12px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scanned .ok{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:#2C6B3C;background:#F0FAF3;height:28px;padding:0 10px;border-radius:14px;flex:none}
.lhead{padding:24px 24px 18px}
.lhead .k{font-size:13px;font-weight:700;color:var(--red);letter-spacing:.02em}
.lhead h2{font-size:26px;line-height:1.36;margin:8px 0 8px;font-weight:800;letter-spacing:-.03em}
.lhead p{margin:0;font-size:14px;color:var(--ink3);line-height:1.6}
.fromstrip{display:flex;gap:10px;align-items:center;margin:12px 16px 0;padding:12px 16px;border-radius:14px;background:#FFF1F0;font-size:13px;color:#8A2A24;line-height:1.5}
.lfoot{flex:none;padding:12px 20px calc(var(--bot) + 14px);background:var(--bg);display:flex;flex-direction:column;gap:8px}
.lfoot .fine{text-align:center;margin-top:2px}
.fgroup{background:#fff;border-radius:20px;margin:0 16px 12px;padding:6px 18px}
.field{padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field>label,.field>.fl{display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.field>label small,.field>.fl small{font-weight:500;color:var(--ink3);font-size:12px}
.req{color:var(--red)}
.inp{display:flex;gap:8px}
.inp input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:12px;border:0;background:var(--soft);outline:0;font-size:15.5px;box-shadow:inset 0 0 0 1px transparent}
.inp input:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp button{flex:none;height:48px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700}
.inp button.done{background:#2DB45A}
.help{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.5}
.linked{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:12px;background:#FFFBD6;font-size:14px}
.wrapchips{display:flex;flex-wrap:wrap;gap:6px}
.gsel{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 14px;border-radius:12px;background:var(--soft);font-size:14.5px}
.gsel .x{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink2);height:36px;padding:0 10px}
.agree{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.agree:last-child{border-bottom:0}
.agree input{display:none}
.agree .cb{flex:none;width:24px;height:24px;border-radius:12px;box-shadow:inset 0 0 0 1.5px #C9CDD3;display:flex;align-items:center;justify-content:center;color:transparent;transition:background .15s}
.agree input:checked+.cb{background:var(--ink);box-shadow:none;color:#fff}
.agree b{display:block;font-size:14.5px}
.agree b em{font-style:normal;color:var(--ink3);font-weight:600;margin-right:4px}
.agree span{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.45}

.tile b,.promo b,.alertrow b,.blist b,.mycourse .now b,.preview .rec b,.prod b,.crow .nm{color:var(--ink)}
.tile>span>span,.promo>span>span,.alertrow>span>span,.blist span span{color:var(--ink3)}
/* 시트 · 토스트 · 오버레이 */
.dim{position:absolute;inset:0;z-index:70;background:rgba(10,14,20,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:71;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px calc(var(--bot) + 20px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab2{width:38px;height:5px;border-radius:3px;background:#D9DCE0;margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sheet .lead{margin:0 0 16px;font-size:14px;color:var(--ink3);line-height:1.6}
.sheet .big-lens{width:150px;height:96px;margin:10px auto 18px}
.toast{position:absolute;z-index:80;left:50%;bottom:calc(var(--tabh) + var(--bot) + 18px);transform:translate(-50%,20px);max-width:calc(100% - 40px);padding:12px 18px;border-radius:14px;background:rgba(21,23,26,.92);color:#fff;font-size:13.5px;font-weight:600;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;text-align:center;width:max-content}
.toast.on{opacity:1;transform:translate(-50%,0)}
.issuing{position:absolute;inset:0;z-index:85;background:rgba(244,245,247,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:16px;font-weight:700}
.issuing.on{display:flex;animation:inF .2s}

function sunTimes(y,m,d,lat,lon){
  const r=Math.PI/180;
  const J=Date.UTC(y,m,d,12)/864e5+2440587.5;
  const n=Math.round(J-2451545+0.0008);
  const Js=n-lon/360;
  const M=((357.5291+0.98560028*Js)%360+360)%360;
  const C=1.9148*Math.sin(M*r)+0.02*Math.sin(2*M*r)+0.0003*Math.sin(3*M*r);
  const L=(M+C+180+102.9372)%360;
  const Jt=2451545+Js+0.0053*Math.sin(M*r)-0.0069*Math.sin(2*L*r);
  const sd=Math.sin(L*r)*Math.sin(23.4397*r),cd=Math.cos(Math.asin(sd));
  const w=Math.acos((Math.sin(-0.833*r)-Math.sin(lat*r)*sd)/(Math.cos(lat*r)*cd))/r;
  const kst=j=>((((j-2440587.5)*1440+540)%1440)+1440)%1440;
  return {rise:kst(Jt-w/360),set:kst(Jt+w/360),noon:kst(Jt)};
}
const hm=m=>{m=Math.round(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const nowK=()=>{const n=new Date();return new Date(n.getTime()+(540+n.getTimezoneOffset())*6e4)};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(nowK());
const nowMin=()=>{const k=nowK();return k.getHours()*60+k.getMinutes()};
function sunFor(c,ds){const [y,m,d]=ds.split('-').map(Number);return sunTimes(y,m-1,d,c.lat,c.lon)}
function bounds(s){
  const b=[s.rise,s.rise+90,Math.max(s.rise+90,660),Math.min(s.set-90,900),s.set-90,s.set];
  for(let i=1;i<b.length;i++)b[i]=Math.max(b[i],b[i-1]);
  return b;
}
function segAt(c,ds,min){const b=bounds(sunFor(c,ds));if(min<b[0])return -1;for(let i=0;i<5;i++)if(min<b[i+1])return i;return 5}

const DEPTH={home:0,map:0,quiz:0,card:0,course:1,owner:1,scan:1,register:2};
const TABOF={home:'home',map:'map',quiz:'quiz',card:'card',course:'map',owner:'card',scan:'card',register:'card'};
const NOTAB={owner:1,scan:1,register:1};
let cur=null;
function parse(){
  let h=decodeURIComponent(location.hash.slice(1));
  const p=h.split('/');let name=p[0]||'home';
  if(!(name in DEPTH))name='home';
  return {name,arg:p[1],arg2:p[2]};
}
let lastKey=null;
function nav(h,replace){
  const url=location.pathname+location.search+'#'+h;
  if(replace)history.replaceState(history.state,'',url);
  else history.pushState({app:1},'',url);
  route();
}
function back(fallback){
  if(history.state&&history.state.app)history.back();
  else nav(fallback||'home',true);
}
function route(){
  if(location.hash===lastKey&&cur)return;
  lastKey=location.hash;
  const r=parse();
  closeSheet();
  if(r.name==='course'&&!course(r.arg)&&!(r.arg||'').startsWith('type-')){nav('map',true);return}
  if(r.name==='register'&&!F.sku){nav('scan',true);return}
  render(r);
  const el=$('s-'+r.name),prev=cur&&$('s-'+cur.name);
  if(prev&&prev!==el){
    const up=DEPTH[r.name]>DEPTH[cur.name],down=DEPTH[r.name]<DEPTH[cur.name];
    document.querySelectorAll('.scr.on').forEach(s=>{if(s!==prev&&s!==el)s.classList.remove('on','inR','outR','inF')});
    const after=(node,fn)=>{let ok=false;const f=()=>{if(ok)return;ok=true;fn()};node.addEventListener('animationend',f,{once:true});setTimeout(f,450)};
    if(down){
      el.classList.remove('outR','inR','inF');el.classList.add('on');
      prev.classList.add('outR');
      after(prev,()=>{if(!cur||cur.name!==prev.id.slice(2))prev.classList.remove('on');prev.classList.remove('outR')});
    }else if(up){
      el.classList.remove('outR');el.classList.add('on','inR');
      after(el,()=>{el.classList.remove('inR');if(!cur||cur.name!==prev.id.slice(2))prev.classList.remove('on')});
    }else{
      prev.classList.remove('on','inR','outR');el.classList.add('on','inF');
      after(el,()=>el.classList.remove('inF'));
    }
  }else el.classList.add('on');
  cur={name:r.name,arg:r.arg};
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TABOF[r.name]));
  $('tabbar').classList.toggle('hide',!!NOTAB[r.name]);
  app.classList.toggle('sb-light',r.name==='scan'||(r.name==='course'&&!$('cTop').classList.contains('solid')));
  if(r.name==='map')setTimeout(()=>initMap(),20);
}
function render(r){
  if(r.name==='home')renderHome();
  if(r.name==='map')renderMapUI();
  if(r.name==='course')openCourse(r.arg,r.arg2);
  if(r.name==='quiz')renderQuiz();
  if(r.name==='card')renderCard();
  if(r.name==='scan')startScan();
  if(r.name==='owner')renderOwner();
  if(r.name==='register')renderReg();
}
window.addEventListener('popstate',route);
window.addEventListener('hashchange',route);

(function sheetDrag(){
  let y0=null,moved=0;
  const start=e=>{y0=(e.touches?e.touches[0]:e).clientY;moved=0};
  const move=e=>{if(y0===null)return;moved=(e.touches?e.touches[0]:e).clientY-y0};
  const end=e=>{
    if(y0===null)return;const tapOnGrab=e.currentTarget.id==='msGrab';y0=null;
    if(moved<-30){M.full=true}else if(moved>30){if(M.full)M.full=false;else M.sel=null}
    else if(tapOnGrab){M.full=!M.full}
    else return;
    if(M.full)M.sel=null;
    $('mq').blur();renderSheet();
  };
  ['msGrab','msHead'].forEach(id=>{const el=$(id);
    el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchmove',move,{passive:true});el.addEventListener('touchend',end);
    el.addEventListener('mousedown',start);el.addEventListener('mousemove',move);el.addEventListener('mouseup',end);el.addEventListener('mouseleave',e=>{if(y0!==null)end(e)});
  });
})();

function renderTimeline(){

function roll(el,target){
  if(!el)return;let t=0;
  const iv=setInterval(()=>{t++;const fixed=Math.floor(t/4);
    el.textContent=target.split('').map((c,i)=>i<fixed?c:String(Math.floor(Math.random()*10))).join('');
    if(fixed>=target.length){clearInterval(iv);el.textContent=target;vibrate(15)}},45);
}
function tilt(card){
  if(!card)return;
  const wrap=card.parentElement;
  wrap.onpointermove=e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg)`;card.style.setProperty('--tx',(x*2).toFixed(2));card.style.setProperty('--ty',(y*2).toFixed(2))};
  wrap.onpointerleave=()=>{card.style.transform='';card.style.setProperty('--tx',0);card.style.setProperty('--ty',0)};
}

    openSheet(`<h3>A/S 바로 접수</h3><p class="lead">카카오 채널 「WTD 아이웨어」로 이어져요. 제품 · 구매처 · 구매일은 자동으로 붙어요</p>
      <div class="wrapchips" id="asChips" style="margin-bottom:12px">${['힌지 · 템플','코받침','렌즈','기타'].map((t,i)=>`<button class="chip ${i?'':'on'}" data-as="${t}">${t}</button>`).join('')}</div>
      <button class="btn line sm" style="margin-bottom:10px">증상 사진 올리기 (선택)</button>
      <button class="btn kakao" data-act="kakao-go">${ic('kakao',20)}카카오 채널로 접수</button>`);return;
  }
  if(a==='proof'){
    const s=SKUS[o.sku];
    openSheet(`<h3>구매 증빙</h3><p class="lead">A/S 접수 때 이 화면이 영수증을 대신해요</p>
      <div class="card" style="margin:0 0 14px;background:var(--soft);padding:6px 16px">
      <div class="kv"><span>제품</span><b>${s.model} · ${s.color}</b></div><div class="kv"><span>제품 코드</span><b>${s.code}</b></div>
      <div class="kv"><span>구매처</span><b>${o.shop}${o.shopName?' · '+o.shopName:''}</b></div><div class="kv"><span>구매일</span><b>${dot(o.date)}</b></div>
      <div class="kv"><span>오너 번호</span><b>No. ${ownerNo(o)}</b></div>
      <div class="kv"><span>교환 · 수리</span><b style="text-align:right">상품 상세페이지 품질보증 기준<br><small style="font-weight:500;color:var(--ink3)">공정거래위원회 소비자분쟁해결기준에 따름</small></b></div></div>
      <button class="btn" data-act="close">닫기</button>`);return;
  }
  if(a==='report'){
    openSheet(`<h3>캐디 시즌 리포트</h3><p class="lead">CADDY+ 리포터 30명이 한 시즌 써 본 기록이에요. 등록 고객에게 공개 전에 먼저 보내요</p>
      <div class="card" style="margin:0 0 14px;background:var(--soft);padding:6px 16px">
        <div class="kv" style="justify-content:flex-start;gap:14px"><span>27.07</span><span style="color:var(--ink)"><b>중간 리포트</b><br><small style="color:var(--ink3)">봄 시즌 · 골프장별 빛 확인 결과</small></span></div>
        <div class="kv" style="justify-content:flex-start;gap:14px"><span>27.11</span><span style="color:var(--ink)"><b>시즌 리포트</b><br><small style="color:var(--ink3)">한 시즌 기록 · 렌즈 색별 후기</small></span></div></div>
      ${!o?'<button class="btn red" data-go="scan">정품 등록하고 먼저 받기</button>':o.ag2?'<p class="fine" style="margin:0 0 12px">받기에 동의하셨어요. 발행되면 알림톡으로 보내 드려요</p><button class="btn" data-act="close">닫기</button>':'<button class="btn red" data-act="agnow" style="margin-bottom:8px">리포트 받기 동의</button><button class="btn line" data-act="close">닫기</button>'}`);return;
  }
  if(a==='hio'){
    const g=course(o.golf);
    openSheet(`<h3>홀인원 각인 신청</h3><p class="lead">홀인원 하신 날 이 고글 템플 바깥쪽에 기록을 새겨 드려요</p>
      <div class="fgroup" style="margin:0 0 14px;background:var(--soft)">
        <div class="field"><div class="fl">날짜 · 골프장 · 홀</div><div class="inp"><input value="2027-05-16" style="background:#fff;flex:0 0 118px"><input value="${g?g.name:''}" placeholder="골프장" style="background:#fff"><input placeholder="홀" inputmode="numeric" style="background:#fff;flex:0 0 56px"></div></div>
        <div class="field"><div class="fl">거리 · 클럽 <small>선택</small></div><div class="inp"><input placeholder="152m" style="background:#fff"><input placeholder="7번 아이언" style="background:#fff"></div></div>
        <div class="field"><div class="fl">캐디 확인 <small>동반 캐디 이름 또는 캐디 코드</small></div><div class="inp"><input placeholder="CD-0123" style="background:#fff"></div></div>
      </div>
      <button class="btn red" data-act="hio-done">신청하기</button><p class="fine c" style="margin:8px 0 0">신청하면 각인 안내와 택배 접수 방법을 보내 드려요</p>`);return;
  }
  if(a==='fit'){
    const s=SKUS[o.sku];
    openSheet(`<h3>내 모델 피팅 영상</h3><p class="lead">${s.model} 코받침 · 브릿지 · 템플을 얼굴에 맞추는 법</p>
      <div class="video">${ic('play',44,0)}<span>피팅 영상 (40초)</span></div>
      <button class="btn" data-act="close">닫기</button>`);
    $('sheet').querySelector('.video svg').setAttribute('fill','#fff');return;
  }
  if(a==='pickgolf'){
    openSheet(`<h3>내 골프장 고르기</h3><p class="lead">고르면 오너 카드에 찍히고 봄 · 가을 라운드 알림이 연결돼요.</p>
      ${COURSES.map(c=>`<button class="crow" data-pick="${c.id}" style="padding:11px 0"><span class="cd" style="background:${LV[TYPES[c.type].base].color}"></span><span><span class="nm">${c.name}</span><span class="sub">${c.area} · ${TYPES[c.type].label}</span></span><span class="rt">${ic('chev',18)}</span></button>`).join('')}`);return;
  }
}

// ================= 전체 클릭 =================
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-go],label.agree');if(!el)return;
  const d=el.dataset;
  if(d.tab){
    const t=d.tab;if(cur&&TABOF[cur.name]===t&&DEPTH[cur.name]===0){const b=$('s-'+t).querySelector('.body');b&&b.scrollTo({top:0,behavior:'smooth'});return}
    if(t==='quiz'&&Q.step===3){}
    nav(t,cur&&cur.name!=='home'&&DEPTH[cur.name]===0);return;
  }
  if(d.back!==undefined){back(cur&&TABOF[cur.name]);return}
  if(d.go){closeSheet();if(d.go==='scan'){resetF();F.from='scan'}nav(d.go);return}
  if(d.film){productSheet(d.film);return}
  if(d.seg!==undefined){M.seg=+d.seg;renderMapUI();vibrate(6);return}
  if(d.region){M.region=d.region;M.sel=null;renderSheet();fitAll(true);return}
  if(d.date){D.date=d.date;renderCourse();return}
  if(d.slot){D.slot=d.slot;renderLight();renderRec();vibrate(6);return}
  if(el.id==='alertRow'){toggleAlert();return}
  if(d.qc){Q.course=d.qc;Q.type=null;renderQuiz();return}
  if(d.qt){Q.type=d.qt;Q.course=null;renderQuiz();return}
  if(d.qtime){Q.time=d.qtime;renderQuiz();return}
  if(d.qg){Q.glasses=d.qg;renderQuiz();return}
  if(el.id==='qNext'){Q.step++;renderQuiz();$('quizBody').scrollTop=0;return}
  if(el.id==='qRestart'){Object.assign(Q,{step:0,course:null,type:null,time:null,glasses:null,q:''});renderQuiz();return}
  if(el.id==='qShare'){share('WTD 렌즈 찾기 결과');return}
  if(d.sku){F.sku=d.sku;$('scanQr').innerHTML='';startScan();return}
  if(d.as){document.querySelectorAll('#asChips .chip').forEach(c=>c.classList.toggle('on',c===el));return}
  if(d.shop){F.shop=d.shop;renderShop();check();return}
  if(d.golf){F.golf=d.golf;F.gq='';renderGolf();return}
  if(d.golfx!==undefined){F.golf=null;renderGolf();return}
  if(d.pick){store.owner.golf=d.pick;if(store.owner.ag2)store.alerts[d.pick]=1;if(!store.fav)store.fav=d.pick;save();closeSheet();renderCard();toast(`${course(d.pick).name}을 내 골프장으로 정했어요`);return}
  const a=d.act;if(!a)return;
  if(a==='close'){closeSheet();return}
  if(a==='reset'){store={owner:null,fav:null,alerts:{}};save();closeSheet();renderCard();toast('등록을 지웠어요');return}
  if(a==='agnow'){store.owner.ag2=true;if(store.owner.golf)store.alerts[store.owner.golf]=1;save();closeSheet();if($('tl'))renderTimeline();toast('라운드 알림 · 캐디 리포트를 받아요');return}
  if(a==='ag-alert'){store.owner.ag2=true;save();closeSheet();toggleAlert();return}
  if(a==='reg-from-course'){closeSheet();resetF({golf:D.c.id,ag2:true,from:'light'});nav('scan');return}
  if(a==='toshop'){closeSheet();toast('WTD 공식몰 상품 페이지로 연결돼요');return}
  if(a==='clip'){openSheet(`<span class="lens big-lens" style="background:linear-gradient(135deg,#fff,#e6e8eb)"></span><h3 class="c">PENTA2 도수 클립</h3><p class="lead c">고글 안쪽에 끼우는 도수 렌즈 틀이에요.<br>가까운 안경원에서 도수를 넣어요.</p><button class="btn" data-act="toshop">WTD 공식몰에서 보기</button>`);return}
  if(a==='kakao-go'){closeSheet();toast('카카오 채널 「WTD 아이웨어」로 연결돼요');return}
  if(a==='hio-done'){closeSheet();toast('각인 신청을 받았어요. 확인 후 연락드릴게요');return}
  if(a==='report-err'){toast('알려 주셔서 고마워요. 확인 후 반영할게요');return}
  if(a==='reqcourse'){toast(`「${M.q}」 등록 요청을 남겼어요`);return}
  actSheet(a);
});

// ================= 상태 막대 시계 · PC용 QR =================
function tick(){const k=nowK();$('sbTime').textContent=k.getHours()+':'+String(k.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,15000);
if(window.QRCode){
  try{new QRCode($('qr'),{text:'https://simonism-ryu.github.io/golf-lens-mockup/',width:256,height:256,colorDark:'#15171A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}
}

// ================= 시작 =================
(function(){
  const P=new URLSearchParams(location.search);
  // 예전 주소 호환: ?course=c2 · ?golf=c2
  if(P.get('course')&&course(P.get('course'))&&!location.hash)history.replaceState(null,'',location.pathname+'#course/'+P.get('course'));
  if(P.get('golf')&&course(P.get('golf'))){F.golf=P.get('golf');F.from='light';F.ag2=true}
  if(location.hash==='#owner'){F.sku=F.sku||'pink';F.from=F.from||'qr'}
  route();
  setTimeout(()=>$('splash').classList.add('off'),location.hash&&location.hash!=='#home'?350:900);
  setTimeout(()=>$('splash').remove(),1400);
})();
</script>
